# GÖ4Fun auf einem Server – alle Teile als Container.
#
#   Internet ─► caddy (HTTPS, Port 80/443)
#                 └─► api        (Laravel, api/)   die ganze API + Bilder unter /storage
#                 scheduler      (dasselbe Abbild)  stündlich: Abos verlängern
#                 db             (MySQL)            ◄── api und scheduler
#
# Das Node-Backend (server/) ist seit dem Marktplatz-Umbau nicht mehr nötig:
# Laravel beantwortet alle Routen selbst und verwaltet auch das Schema
# (`php artisan migrate` beim Start, siehe api/docker/entrypoint.sh).
# Von außen erreichbar ist nur Caddy.
#
# Starten (im Ordner deploy/, nach dem Ausfüllen von .env):
#
#   docker compose up -d --build
#
# Anleitung Schritt für Schritt: deploy/README.md

x-laravel-env: &laravel-env
  APP_NAME: GÖ4Fun
  APP_ENV: production
  # Niemals true auf dem Server: Laravel zeigte dann bei jedem Fehler
  # Quelltext, Pfade und Umgebungsvariablen – auch Passwörter.
  APP_DEBUG: 'false'
  APP_KEY: ${APP_KEY:?APP_KEY fehlt in deploy/.env (siehe README, Schritt 4)}
  APP_URL: https://${DOMAIN:?DOMAIN fehlt in deploy/.env}
  PUBLIC_URL: https://${DOMAIN:?}
  # UTC – MySQL läuft im Container ohnehin in UTC, und die API hängt an Zeiten
  # aus der Datenbank ein „Z" an. (Am Entwicklungs-PC steht APP_TIMEZONE auf
  # Europe/Berlin, weil MySQL dort in deutscher Ortszeit läuft.)
  APP_TIMEZONE: UTC
  APP_LOCALE: de
  APP_FALLBACK_LOCALE: de
  # Fehler landen in `docker compose logs api`, nicht in einer Datei im Container.
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-warning}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: '3306'
  DB_DATABASE: goenntertainment
  DB_USERNAME: goenn
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in deploy/.env}
  # file  = Zähler fürs Rate-Limiting (Anmelde-Versuche, Gutscheine) im Container
  # array = keine Sitzungen – die API arbeitet nur mit Tokens
  # sync  = Mails (2FA-Codes) gehen sofort raus, nicht über eine Warteschlange
  CACHE_STORE: file
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  # Zahlungen: `off` (Standard auf dem Server) lehnt Käufe und Abos ab, `test`
  # bucht ohne echtes Geld. Echte Zahlungen kommen erst mit einem Zahlungsanbieter.
  PAYMENTS_MODE: ${PAYMENTS_MODE:-off}
  # Mail-Versand für 2FA-Codes und „Passwort vergessen". Ohne Zugang meldet
  # die App „Wir konnten dir gerade keinen Code schicken".
  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_SCHEME: ${MAIL_SCHEME:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@${DOMAIN}}
  MAIL_FROM_NAME: GÖ4Fun

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: goenntertainment
      MYSQL_USER: goenn
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD fehlt in deploy/.env}
    volumes:
      # Die Tabellen legt Laravel beim Start an (php artisan migrate).
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${DB_ROOT_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Bereitet den Upload-Ordner vor und beendet sich dann wieder.
  #
  # Docker legt einen fehlenden Ordner für ein Bind-Mount als root an. Apache
  # läuft aber als `www-data` (UID 33) und könnte dort nichts speichern – jeder
  # Upload (Partner-Logo, Angebotsbild) scheiterte mit „Serverfehler".
  #
  # Als Liste und in EINER Zeile: Als gefalteter YAML-Block behielt die Shell
  # die Zeilenumbrüche und scheiterte am `&&` am Zeilenanfang.
  storage-init:
    image: busybox:1.37
    command: ['sh', '-c', 'mkdir -p /storage && chown -R 33:33 /storage']
    volumes:
      - ./storage:/storage

  api:
    build:
      context: ../api
      additional_contexts:
        shared: ../shared
    image: goenn/api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      <<: *laravel-env
      # Nur dieser Container spielt Schema-Änderungen ein, nicht auch noch der
      # scheduler – zwei gleichzeitige `migrate` könnten sich in die Quere kommen.
      RUN_MIGRATIONS: 'true'
      # Uploads schreibt Laravel genau in den Ordner, den Apache unter /storage ausliefert.
      UPLOADS_ROOT: /var/www/api/public/storage
    volumes:
      - ./storage:/var/www/api/public/storage

  # Führt den Laravel-Zeitplan aus (api/routes/console.php): stündlich
  # `club:renew` – Abos verlängern, gekündigte auslaufen lassen, Monats-Credits.
  scheduler:
    image: goenn/api:local
    restart: unless-stopped
    user: www-data
    depends_on:
      api:
        condition: service_started
    environment:
      <<: *laravel-env
    command: ['php', 'artisan', 'schedule:work']
    # Das Abbild prüft sonst Apache – den gibt es in diesem Container nicht.
    healthcheck:
      disable: true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Hier liegen die Let's-Encrypt-Zertifikate. Ohne dieses Volume holt Caddy
      # bei jedem Neustart neue und läuft irgendwann ins Rate-Limit.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
