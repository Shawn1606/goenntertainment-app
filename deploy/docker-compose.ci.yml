# CI AND LOCAL TESTS ONLY - NOT FOR PRODUCTION. An override of docker-compose.yml for the
# automatic checks (.github/workflows/docker.yml, deploy/test/), always used with deploy/ci.env.
#
# What it changes, and why:
#   - every network is internal: the test stack reaches nothing outside this machine, not even
#     the internet (no ACME: DOMAIN=localhost makes Caddy use its internal CA);
#   - caddy publishes no host port: tests reach it over the edge network;
#   - Mailpit catches every mail (no code ever lands in a log);
#   - node's moderation client points at a closed local port.
#
# Start command and settings for a local run: see the header of deploy/ci.env.

services:
  caddy:
    # !reset needs Compose >= 2.24.4.
    ports: !reset []

  api:
    environment:
      # CI has no real mail server: Mailpit catches every mail, so no code is ever written to a log.
      MAIL_HOST: mailpit
      MAIL_PORT: '1025'
    depends_on:
      mailpit:
        condition: service_healthy

  node:
    environment:
      # The CI stack never talks to the moderation provider. Written out here, not taken from
      # ci.env: Compose prefers a variable of the calling shell over the env file, so a shell that
      # exports its own ANTHROPIC_BASE_URL would otherwise point the stack at the real provider.
      # Nothing listens on this address; with MODERATION_FAIL_OPEN=true (ci.env) the test's
      # event still goes through.
      ANTHROPIC_BASE_URL: http://127.0.0.1:9

  # The development mail catcher (pinned image), reused so the pin lives in one place. Its host
  # ports are dropped: api reaches Mailpit over the app network.
  mailpit:
    extends:
      file: ../dev/docker-compose.yml
      service: mailpit
    ports: !reset []
    networks: [app]

networks:
  edge:
    internal: true
  outbound:
    internal: true
