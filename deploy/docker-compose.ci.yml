# Ergänzung NUR für die automatische Prüfung auf GitHub (.github/workflows/docker.yml).
#
# Auf dem Server ist Laravel nur über Caddy erreichbar. In der Prüfung gibt es
# keine Domain und kein Zertifikat – also wird Laravel direkt auf Port 8080
# geöffnet, damit das Prüfskript es ansprechen kann. Caddy startet dort gar nicht.
#
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait db node api

services:
  api:
    ports:
      # Loopback only: the CI stack is never reachable from outside the runner.
      - '127.0.0.1:8080:80'
    environment:
      # CI has no real mail server: Mailpit catches every mail, so no code is ever written to a log.
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: '1025'
    depends_on:
      mailpit:
        condition: service_healthy

  # The development mail catcher (pinned image, 127.0.0.1-only ports), reused so the pin lives in
  # one place.
  mailpit:
    extends:
      file: ../dev/docker-compose.yml
      service: mailpit
