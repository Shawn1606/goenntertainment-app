# Ergänzung NUR für die automatische Prüfung auf GitHub (.github/workflows/docker.yml).
#
# Auf dem Server ist Laravel nur über Caddy erreichbar. In der Prüfung gibt es
# keine Domain und kein Zertifikat – also wird Laravel direkt auf Port 8080
# geöffnet, damit das Prüfskript es ansprechen kann. Caddy startet dort gar nicht.
#
# Start command and settings for a local run: see the header of deploy/ci.env (the one copy of the
# command; --env-file ci.env, no --wait - .github/workflows/docker.yml says why).

services:
  api:
    ports:
      # Loopback only: the CI stack is never reachable from outside the runner.
      - '127.0.0.1:8080:80'
    environment:
      # CI has no real mail server: Mailpit catches every mail, so no code is ever written to a log.
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: '1025'
    depends_on:
      mailpit:
        condition: service_healthy

  node:
    environment:
      # The CI stack never talks to the moderation provider. Written out here, not taken from
      # ci.env: Compose prefers a variable of the calling shell over the env file, so a shell that
      # exports its own ANTHROPIC_BASE_URL would otherwise point the stack at the real provider.
      # Nothing listens on this address; with MODERATION_FAIL_OPEN=true (ci.env) the smoke
      # test's event still goes through.
      ANTHROPIC_BASE_URL: http://127.0.0.1:9

  # The development mail catcher (pinned image), reused so the pin lives in one place. Its host
  # ports are dropped (!reset needs Compose >= 2.24.4): api reaches Mailpit over the compose
  # network, so the CI stack publishes no Mailpit port at all.
  mailpit:
    extends:
      file: ../dev/docker-compose.yml
      service: mailpit
    ports: !reset []
