# Apache-Einstellungen für die Laravel-API im Container.

# Laravels public/.htaccess wirken lassen – NUR hier, nicht global. Ohne das
# ignoriert Apache die Datei, und jede Adresse außer „/" liefe ins 404.
<Directory /var/www/api/public>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Uploaded files (the read-only mount of Node's public uploads, deploy/docker-compose.yml):
# the browser must take the type as sent and never guess another one (F-11). "always" also
# covers error answers.
<Directory /var/www/api/public/storage>
    Header always set X-Content-Type-Options "nosniff"
</Directory>

# Evidence and story images are private (F-11): Node keeps them outside this tree
# (server/src/storage.js) and serves them only through checked routes. Should an old file
# still lie in one of these folders, Apache refuses it all the same.
<LocationMatch "(?i)^/+storage/+(evidence|stories)(/|$)">
    Require all denied
</LocationMatch>

# Keine Versionsnummern in Fehlerseiten und Kopfzeilen – verrät Angreifern nur,
# wonach sie suchen müssen.
ServerTokens Prod
ServerSignature Off
