# Apache-Einstellungen für die Laravel-API im Container.

# Laravels public/.htaccess wirken lassen – NUR hier, nicht global. Ohne das
# ignoriert Apache die Datei, und jede Adresse außer „/" liefe ins 404.
<Directory /var/www/api/public>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Uploads are never served by Apache (F-29). Node stores them, the edge serves the public ones as
# static files (deploy/Caddyfile), and Node serves evidence and story images only through its
# checked routes (server/src/storage.js). The image has no upload folder under the docroot (the
# build stops if one comes in with the code, ../Dockerfile). Should one be mounted or linked
# here all the same, Apache refuses it three times over: no request is allowed in, PHP stays off
# even if one were, and no .htaccess file in it is read (it could switch either back on).
<Directory /var/www/api/public/storage>
    AllowOverride None
    Options None
    Require all denied
    php_admin_flag engine off
</Directory>

# Keine Versionsnummern in Fehlerseiten und Kopfzeilen – verrät Angreifern nur,
# wonach sie suchen müssen.
ServerTokens Prod
ServerSignature Off
