# Apache-Einstellungen für die Laravel-API im Container.

# Laravels public/.htaccess wirken lassen – NUR hier, nicht global. Ohne das
# ignoriert Apache die Datei, und jede Adresse außer „/" liefe ins 404.
<Directory /var/www/api/public>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Uploads are never served by Apache (F-29). Laravel stores them in two volumes mounted outside
# the docroot and outside /var/www (/var/lib/goenn, deploy/docker-compose.yml), the edge serves
# the public ones as static files (deploy/Caddyfile, deploy/Caddyfile.media), and evidence
# images leave only through Laravel's admin route (app/Support/Uploads.php). The image has no
# upload folder under the docroot (the build stops if one comes in with the code,
# ../Dockerfile). Should one be mounted or linked here all the same, Apache refuses it three
# times over: no request is allowed in, PHP stays off even if one were, and no .htaccess file in
# it is read (it could switch either back on). The volumes' own folder gets the same refusal,
# should a link in the docroot ever point there.
#
# Installed as conf-available/zz-goenn.conf (../Dockerfile), so it loads after Debian's
# security.conf and its ServerTokens and ServerSignature below are the ones in effect.
<Directory /var/www/api/public/storage>
    AllowOverride None
    Options None
    Require all denied
    php_admin_flag engine off
</Directory>
<Directory /var/lib/goenn>
    AllowOverride None
    Options None
    Require all denied
    php_admin_flag engine off
</Directory>

# Keine Versionsnummern in Fehlerseiten und Kopfzeilen – verrät Angreifern nur,
# wonach sie suchen müssen.
ServerTokens Prod
ServerSignature Off
