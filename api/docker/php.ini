; PHP-Einstellungen für die Laravel-API im Container.

; ---------------------------------------------------------------- Uploads
; Die Vorgabe von PHP sind 2 MB pro Datei. Handyfotos sind oft größer – und Laravel
; reicht Uploads an das Node-Backend weiter, das selbst bis 5 MB annimmt. Liegt
; PHPs Grenze darunter, kommt das Bild nie bei Node an. Etwas Luft darüber, damit
; Node mit seiner eigenen, in der App lesbaren Meldung ablehnt.
upload_max_filesize = 8M
post_max_size = 10M

; ---------------------------------------------------------------- Laufzeit
memory_limit = 256M
max_execution_time = 60
; UTC wie MySQL und Node im Container (Begründung in deploy/docker-compose.yml).
date.timezone = UTC
expose_php = Off

; ---------------------------------------------------------------- OPcache
; Übersetzter Code bleibt im Speicher. validate_timestamps=0: Im Container ändert
; sich der Code nie (eine neue Version ist ein neues Abbild), also muss PHP auch
; nicht bei jeder Anfrage nachsehen, ob sich eine Datei geändert hat.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
